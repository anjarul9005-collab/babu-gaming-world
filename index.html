
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Babu Gaming</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #090d18;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  background: #111a2c;
  padding: 22px;
  text-align: center;
  border-bottom: 2px solid #00e5ff;
}

header h1 {
  color: #00e5ff;
  font-size: 30px;
}

nav {
  text-align: center;
  padding: 18px;
}

nav a {
  color: white;
  text-decoration: none;
  margin: 10px;
}

.hero {
  text-align: center;
  padding: 65px 15px;
  background: linear-gradient(135deg,#101c3a,#25205a);
}

.hero h2 {
  font-size: 32px;
  color: #00e5ff;
}

.hero p {
  margin: 18px 0;
}

button {
  background: #00e5ff;
  color: #07101b;
  border: none;
  padding: 13px 25px;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
}

.games {
  padding: 30px 15px;
  text-align: center;
}

.games h2 {
  color: #00e5ff;
  margin-bottom: 25px;
}

.game {
  background: #151f32;
  margin: 15px auto;
  padding: 25px;
  max-width: 350px;
  border-radius: 12px;
  border: 1px solid #00e5ff;
}

.game h3 {
  margin-bottom: 15px;
}

footer {
  text-align: center;
  padding: 25px;
  color: #aaa;
}
</style>
</head>

<body>

<header>
  <h1>🎮 BABU GAMING</h1>
  <p>Welcome to My Gaming World</p>
</header>

<nav>
  <a href="#home">Home</a>
  <a href="#games">Games</a>
  <a href="#about">About</a>
</nav>

<section class="hero" id="home">
  <h2>WELCOME GAMERS!</h2>
  <p>Enter The World Of Gaming</p>
  <button onclick="document.getElementById('games').scrollIntoView()">
    Explore Games
  </button>
</section>

<section class="games" id="games">
  <h2>🔥 POPULAR GAMES</h2>

  <div class="game">
    <h3>🎯 Free Fire</h3>
    <p>Battle Royale Gaming</p>
  </div>

  <div class="game">
    <h3>🚗 GTA V</h3>
    <p>Open World Gaming</p>
  </div>

  <div class="game">
    <h3>⛏️ Minecraft</h3>
    <p>Creative Gaming</p>
  </div>
</section>

<section class="games" id="about">
  <h2>ABOUT US</h2>
  <p>This is Babu's Gaming Website!</p>
</section>

<footer>
  <p>© 2026 Babu Gaming</p>
</footer>

</body>
</html>
